# scripts/check.conf — cep-garaj (bootstrap 2026-11-13). Format: scripts/check.conf.example.
#
# GREENFIELD: no code exists yet (AGENTS.md rule 1), so every step below is PLANNED and commented
# out. The walking skeleton spec (0001) creates package.json + the npm scripts named here and
# activates these lines; its PLAN gate shows doctor's per-profile verdict (R-13), its BUILD runs
# ./scripts/residue (both profiles) and confirms each test step's test count.
#
# npm scripts the skeleton must define (all run-once, never watch/serve):
#   typecheck = tsc --noEmit · lint = eslint . --max-warnings=0 · format:check = prettier --check .
#   test:unit = vitest run --project unit   (include **/*.test.ts(x), exclude **/*.int.test.ts)
#   test:int  = vitest run --project int    (include **/*.int.test.ts only)
#   -> one selector, inverted: fast ∪ full-only = every test (docs/testing.md, Two speeds rule 4)
#   build = vite build
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
#   tsc        — leaves nothing with --noEmit and no --watch; never tsserver/tsc -b --watch here.
#   eslint     — run-once CLI; never eslint_d (daemon).
#   prettier   — run-once CLI (--check writes nothing).
#   vitest     — `vitest` alone enters WATCH mode on a TTY: always `vitest run` (Known traps 3);
#                worker pool exits with the run. Data: each test gets a fresh fake-indexeddb
#                (in-memory, rule 5) — nothing reaches the next run.
#   vite build — writes dist/ (gitignored, overwritten each run); never `vite`/`vite preview` (servers).
#   npm audit  — run-once; needs network, so full-only with a requires line.
#   Service worker: not registered in test builds (Known traps 5).
# Determinism: TZ fixed per test step; tr-TR locale and fast-check seed fixed in the Vitest setup file.
#
# --- planned prerequisites ---
# requires typecheck: node -e "process.exit(+process.versions.node.split('.')[0] >= 24 ? 0 : 1)"
# requires audit: npm ping
#
# --- planned steps (fast = compile + quick tests + lint; full adds the rest) ---
# typecheck [fast]: npm run --silent typecheck
# lint [fast]: npm run --silent lint
# format [fast]: npm run --silent format:check
# test [fast]: TZ=Europe/Istanbul npm run --silent test:unit
# integration: TZ=Europe/Istanbul npm run --silent test:int
# build: npm run --silent build
# audit: npm audit --audit-level=high
